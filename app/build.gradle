plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nx.mobilelink'
    compileSdk 34

    defaultConfig {
        applicationId "com.nx.mobilelink"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure native Android framework - no external bloated dependencies required
}
